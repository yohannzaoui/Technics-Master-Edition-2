<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission 778CDT - Corrected Symmetry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --chassis-gradient: linear-gradient(to bottom, #2c2e31 0%, #242629 50%, #1c1e21 100%);
            --lcd-bg: #000000;
            --gold: #d4af37;
            --led-red: #ff1100;
            --led-off: #330000;
            --badge-bg: #080808;
            --border-black: #000000;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        .hi-fi-container {
            background: var(--chassis-gradient);
            width: 95%;
            max-width: 1200px;
            min-height: 600px;
            padding: 40px 60px;
            border-radius: 4px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 40px 100px rgba(0,0,0,1);
            position: relative;
            border-bottom: 10px solid #111;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .disc-drawer-container {
            width: 70%;
            margin: 0 auto 50px;
            padding: 3px; 
            background-color: var(--border-black);
            border-radius: 2px;
            z-index: 2;
        }

        .disc-drawer-front {
            height: 34px; 
            background: var(--chassis-gradient);
            border-radius: 1px;
        }

        .interface-grid {
            display: grid;
            grid-template-columns: 120px 1fr 120px;
            gap: 20px;
            align-items: center; 
            z-index: 2;
        }

        .controls-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn-group-row {
            display: flex;
            gap: 10px;
        }

        .btn-square {
            background: linear-gradient(145deg, #3a3c3f, #1a1c1e);
            border: 1px solid #000;
            color: #777;
            height: 32px;
            cursor: pointer;
            border-radius: 2px;
            font-size: 13px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .btn-wide { width: 110px; }
        .btn-small { width: 50px; }

        .lcd-screen {
            background: var(--lcd-bg);
            border: 1px solid #222;
            padding: 20px;
            text-align: center;
            border-radius: 4px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 60px rgba(255,255,255,0.02);
            box-sizing: border-box;
        }

        .brand-logo { height: 45px; width: auto; filter: grayscale(1); opacity: 0.85; }

        .track-info {
            font-size: 18px;
            margin-top: 20px;
            color: #444;
            letter-spacing: 10px;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
        }

        .power-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .power-btn {
            background: radial-gradient(circle, #444, #111);
            border: 2px solid #000;
            width: 65px; height: 65px; border-radius: 50%;
            color: #333; cursor: pointer; font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        .power-led {
            width: 8px; height: 8px; background: var(--led-red); border-radius: 50%;
            margin-top: 15px; box-shadow: 0 0 10px var(--led-red);
        }

        .power-led.off { background: var(--led-off); box-shadow: none; }

        .unified-bottom-badge {
            background-color: var(--badge-bg);
            padding: 15px 50px;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .badge-logo { height: 22px; filter: grayscale(1) brightness(1.3); }
        .model-label-text { font-weight: 300; font-size: 30px; color: #fff; letter-spacing: 3px; }

    </style>
</head>
<body class="dark-mode">

    <div class="hi-fi-container">
        <div class="disc-drawer-container">
            <div class="disc-drawer-front"></div>
        </div>

        <div class="interface-grid">
            <div class="controls-column">
                <button class="btn-square btn-wide" id="eject-btn" title="Eject CD">
                    <i class="fa-solid fa-eject"></i>
                </button>
                <div class="btn-group-row">
                    <button class="btn-square btn-small" title="Menu"><i class="fa-solid fa-bars"></i></button>
                    <button class="btn-square btn-small" title="Source"><i class="fa-solid fa-layer-group"></i></button>
                </div>
            </div>

            <div class="center-panel">
                <div class="lcd-screen">
                    <img src="img/mission_logo.png" alt="Mission" class="brand-logo" id="lcd-logo">
                    <div class="track-info" id="track-info">READY</div>
                </div>
            </div>

            <div class="controls-column">
                <button class="btn-square btn-wide" id="play-btn" title="Play/Pause">
                    <i class="fa-solid fa-play"></i>&nbsp;<i class="fa-solid fa-pause"></i>
                </button>
                <div class="btn-group-row">
                    <button class="btn-square btn-small" id="prev-btn" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="btn-square btn-small" id="next-btn" title="Next"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>
        </div>

        <div class="power-section">
            <button class="power-btn" id="power-toggle"><i class="fa-solid fa-power-off"></i></button>
            <div class="power-led" id="power-led"></div>
        </div>

        <div class="unified-bottom-badge">
            <img src="img/mission_logo.png" alt="Mission" class="badge-logo">
            <span class="model-label-text">778CDT</span>
        </div>

        <input type="file" id="file-input" accept=".flac" style="display:none">
    </div>

    <script>
        const audio = new Audio();
        const trackInfo = document.getElementById('track-info');
        const fileInput = document.getElementById('file-input');
        const powerLed = document.getElementById('power-led');
        const playBtn = document.getElementById('play-btn');
        const lcdLogo = document.getElementById('lcd-logo');
        let isOn = true;

        document.getElementById('power-toggle').addEventListener('click', () => {
            isOn = !isOn;
            powerLed.classList.toggle('off');
            lcdLogo.style.opacity = isOn ? "0.85" : "0.02";
            trackInfo.style.opacity = isOn ? "1" : "0";
            if (!isOn) audio.pause();
        });

        document.getElementById('eject-btn').addEventListener('click', () => {
            if(isOn) fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && isOn) {
                const url = URL.createObjectURL(file);
                audio.src = url;
                trackInfo.textContent = file.name.substring(0, 15).toUpperCase();
                audio.play();
                playBtn.style.color = "var(--gold)";
            }
        });

        playBtn.addEventListener('click', () => {
            if (!isOn || !audio.src) return;
            if (audio.paused) {
                audio.play();
                playBtn.style.color = "var(--gold)";
            } else {
                audio.pause();
                playBtn.style.color = "#777";
            }
        });
    </script>
</body>
</html>

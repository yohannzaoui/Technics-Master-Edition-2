<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technics 778CDT - Grand Master Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --chassis-gradient: linear-gradient(to bottom, #2c2e31 0%, #242629 50%, #1c1e21 100%);
            --lcd-bg: #000000;
            --gold: #d4af37;
            --pure-white: #ffffff;
            --led-red: #ff1100;
            --led-off: #1a0000;
            --badge-bg: #080808;
            --backlight: rgba(255, 255, 255, 0.7); 
        }

        body {
            background-color: var(--bg-color);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; font-family: 'Segoe UI', Arial, sans-serif;
            color: white; overflow: hidden;
        }

        /* CONTAINER MASTER : 1500px x 720px */
        .hi-fi-container {
            background: var(--chassis-gradient);
            width: 1500px; height: 720px; padding: 30px 90px; 
            border-radius: 4px; position: relative; border-bottom: 15px solid #111;
            display: flex; flex-direction: column; box-sizing: border-box;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 40px 100px rgba(0,0,0,1), 0 -50px 200px var(--backlight);
        }

        /* OVERLAYS */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px); }
        .modal-content { background: #111; border: 1px solid #333; border-radius: 4px; position: relative; width: 600px; }
        .modal-close { position: absolute; top: -50px; right: 0; color: #555; font-size: 40px; cursor: pointer; }
        #playlist-items { max-height: 500px; overflow-y: auto; }
        .playlist-item { padding: 15px 25px; border-bottom: 1px solid #222; cursor: pointer; font-size: 12px; font-family: 'Courier New'; text-transform: uppercase; color: #888; }
        .playlist-item:hover { background: #1a1a1a; color: var(--gold); }
        .playlist-item.active { color: var(--gold); font-weight: bold; background: #080808; }

        /* CD TIROIR AGRANDI */
        .drawer-wrapper { height: 130px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        .drawer-slot-area { width: 65%; height: 85px; background-color: #000; border: 2px solid #111; border-radius: 2px; position: relative; overflow: hidden; }
        .disc-drawer-front { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--chassis-gradient); 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; justify-content: center; align-items: center;
        }
        .drawer-slot-area.open .disc-drawer-front { transform: translateY(100%); }
        .mash-logo-drawer { height: 24px; width: auto; opacity: 0.85; filter: brightness(1.2); }

        /* INTERFACE GRID */
        .interface-grid { display: grid; grid-template-columns: 180px 1fr 180px; gap: 40px; align-items: center; flex-grow: 1; }
        .controls-column { display: flex; flex-direction: column; gap: 30px; }
        .btn-square { background: linear-gradient(145deg, #3a3c3f, #1a1c1e); border: 1px solid #000; color: #777; height: 45px; cursor: pointer; border-radius: 2px; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 1.1em; }
        .btn-active { color: var(--gold) !important; text-shadow: 0 0 5px var(--gold); }

        @keyframes pulse-yellow { 0%, 100% { color: #777; } 50% { color: #ffcc00; text-shadow: 0 0 10px rgba(255,204,0,0.4); } }
        .paused-blink { animation: pulse-yellow 1.5s infinite ease-in-out; }

        /* LCD ECRAN AGRANDI */
        .lcd-screen { background: var(--lcd-bg); border: 1px solid #222; padding: 30px; border-radius: 4px; height: 280px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; width: 100%; box-sizing: border-box; }
        .status-container { position: absolute; top: 30px; opacity: 0; transition: 0.5s; cursor: pointer; }
        .lcd-label { display: block; font-size: 10px; color: #444; letter-spacing: 2px; font-weight: 900; margin-bottom: 4px; }
        .lcd-value { font-size: 20px; color: var(--gold); font-family: 'Courier New'; font-weight: bold; }
        .brand-logo { height: 45px; width: auto; filter: grayscale(1) brightness(1.2); opacity: 0.85; }

        /* TRAPPE BASSE : Look Chassis + Bordure 3px + Hauteur ajustée */
        .logo-slot-container { 
            width: 100%; 
            height: 140px; 
            border: 3px solid #000; 
            border-radius: 4px; 
            position: relative; 
            overflow: hidden; 
            background-color: #030303; 
            margin-top: 20px; 
            box-sizing: border-box;
        }
        .sub-controls-inner { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; gap: 15px; padding: 0 30px; box-sizing: border-box; flex-wrap: wrap; align-content: center; }
        .mini-btn { background: #1a1a1a; border: 1px solid #333; color: var(--pure-white); padding: 8px 12px; font-size: 11px; font-weight: 800; cursor: pointer; border-radius: 3px; min-width: 70px; text-align: center; text-transform: uppercase; }
        .divider { width: 1px; height: 35px; background: #222; }

        .sliding-badge-plate { 
            width: 100%; 
            height: 100%; 
            background: var(--chassis-gradient); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 100px; 
            box-sizing: border-box; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 10; 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .logo-slot-container.open .sliding-badge-plate { transform: translateY(100%); }
        
        /* LOGO TECHNICS RÉDUIT À 26PX */
        .sliding-badge-plate img:first-child {
            height: 26px;
            width: auto;
            filter: grayscale(1) brightness(1.5);
        }
        .hr-logo-badge { height: 50px; width: auto; }

        /* POWER SECTION */
        .power-section { display: flex; flex-direction: column; align-items: center; margin: 15px 0; }
        .power-btn { background: radial-gradient(circle, #444, #111); border: 2px solid #000; width: 65px; height: 65px; border-radius: 50%; color: #333; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .power-led { width: 10px; height: 10px; background: var(--led-red); border-radius: 50%; margin-top: 10px; box-shadow: 0 0 10px var(--led-red); }
        .power-led.off { background: var(--led-off); box-shadow: none; }
    </style>
</head>
<body>

    <div class="hi-fi-container">
        <div class="overlay" id="artwork-overlay"><div class="modal-content" style="text-align:center; background:none; border:none;"><span class="modal-close" id="close-artwork">&times;</span><img id="album-cover" src="" style="width:450px; height:450px; object-fit:cover; border:1px solid #333; margin-bottom:25px;"></div></div>
        <div class="overlay" id="playlist-overlay"><div class="modal-content"><div style="padding:20px; border-bottom:1px solid #222; display:flex; justify-content:space-between; align-items:center;"><h3 style="margin:0; font-size:13px; color:var(--gold); letter-spacing:2px;">TECHNICS PLAYLIST</h3><span id="close-playlist" style="color:#555; cursor:pointer; font-size:28px;">&times;</span></div><div id="playlist-items"></div></div></div>

        <div class="drawer-wrapper">
            <div class="drawer-slot-area" id="drawer-area">
                <div class="disc-drawer-front">
                    <img src="img/mash_logo_t.png" alt="MASH" class="mash-logo-drawer">
                </div>
            </div>
        </div>

        <div class="interface-grid">
            <div class="controls-column">
                <button class="btn-square" id="eject-btn" style="width:100%"><i class="fa-solid fa-eject"></i></button>
                <div style="display:flex; gap:15px;">
                    <button class="btn-square" id="menu-btn" style="width:50%"><i class="fa-solid fa-bars"></i></button>
                    <button class="btn-square" style="width:50%"><i class="fa-solid fa-layer-group"></i></button>
                </div>
            </div>

            <div class="lcd-screen">
                <div class="status-container" id="time-container" style="left:40px; text-align:left;">
                    <span class="lcd-label" id="time-label">TIME</span>
                    <span class="lcd-value" id="time-display">00:00</span>
                </div>
                <div class="status-container" id="playlist-container" style="right:40px; text-align:right;">
                    <span class="lcd-label">TRACK</span>
                    <span class="lcd-value" id="playlist-status">00/00</span>
                </div>
                <img src="img/Technics-Logo-org.png" alt="Technics" class="brand-logo" id="lcd-logo">
                <div id="track-info-block" style="display: none; flex-direction: column; align-items: center; gap: 12px; width:95%;">
                    <div id="track-title" class="lcd-value" style="font-size:24px; color:white; cursor:pointer; text-align:center;"></div>
                    <div id="track-meta" style="font-size:13px; color:rgba(255,255,255,0.5); text-transform:uppercase; font-family:'Courier New';"></div>
                </div>
            </div>

            <div class="controls-column">
                <button class="btn-square" id="play-btn" style="width:100%"><i class="fa-solid fa-play"></i>&nbsp;<i class="fa-solid fa-pause"></i></button>
                <div style="display:flex; gap:15px;">
                    <button class="btn-square" id="prev-btn" style="width:50%"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="btn-square" id="next-btn" style="width:50%"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>
        </div>

        <div class="power-section">
            <button class="power-btn" id="power-toggle"><i class="fa-solid fa-power-off"></i></button>
            <div class="power-led" id="power-led"></div>
        </div>

        <div class="logo-slot-container" id="logo-slot">
            <div class="sub-controls-inner">
                <button class="mini-btn">VOL-</button><button class="mini-btn">VOL+</button><button class="mini-btn">MUTE</button>
                <div class="divider"></div>
                <button class="mini-btn">BASS-</button><button class="mini-btn">BASS+</button>
                <div class="divider"></div>
                <button class="mini-btn">TREB-</button><button class="mini-btn">TREB+</button>
                <div class="divider"></div>
                <button class="mini-btn">VU</button><button class="mini-btn">RANDOM</button><button class="mini-btn">REPEAT</button><button class="mini-btn">A-B</button>
            </div>
            <div class="sliding-badge-plate">
                <img src="img/Technics-Logo-org.png" alt="Technics">
                <img src="img/HR_logo.png" alt="High-Res" class="hr-logo-badge">
            </div>
        </div>

        <input type="file" id="file-input" multiple style="display:none" accept=".mp3,.flac,.wav,.m4a">
    </div>

    <script>
        const jsmediatags = window.jsmediatags;
        const audio = new Audio();
        let isOn = true;
        let playlist = [];
        let currentIndex = 0;
        let showRemaining = false;
        let currentCover = "";

        const trackTitle = document.getElementById('track-title');
        const trackMeta = document.getElementById('track-meta');
        const infoBlock = document.getElementById('track-info-block');
        const lcdLogo = document.getElementById('lcd-logo');
        const fileInput = document.getElementById('file-input');
        const drawerArea = document.getElementById('drawer-area');
        const playBtn = document.getElementById('play-btn');
        const logoSlot = document.getElementById('logo-slot');
        const menuBtn = document.getElementById('menu-btn');

        function formatNum(num) { return num.toString().padStart(2, '0'); }
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${formatNum(mins)}:${formatNum(secs)}`;
        }

        menuBtn.onclick = () => { if(isOn) { logoSlot.classList.toggle('open'); menuBtn.classList.toggle('btn-active'); } };

        function updateDisplay() {
            if (playlist.length > 0) {
                lcdLogo.style.display = 'none';
                infoBlock.style.display = 'flex';
                document.getElementById('time-container').style.opacity = "1";
                document.getElementById('playlist-container').style.opacity = "1";
                document.getElementById('playlist-status').textContent = `${formatNum(currentIndex + 1)}/${formatNum(playlist.length)}`;
                
                const file = playlist[currentIndex];
                trackTitle.textContent = file.name.replace(/\.[^/.]+$/, "");
                
                jsmediatags.read(file, {
                    onSuccess: (tag) => {
                        const t = tag.tags;
                        trackMeta.textContent = `${t.artist || "UNKNOWN"} - ${t.album || "UNKNOWN"}`;
                        if (t.picture) {
                            const { data, format } = t.picture;
                            let base = "";
                            for (let i = 0; i < data.length; i++) base += String.fromCharCode(data[i]);
                            currentCover = `data:${format};base64,${window.btoa(base)}`;
                        } else { currentCover = "https://via.placeholder.com/400/111/d4af37?text=NO+COVER"; }
                    }
                });

                if (audio.paused) playBtn.classList.add('paused-blink'); else playBtn.classList.remove('paused-blink');
                playBtn.style.color = audio.paused ? "#777" : "var(--gold)";
            }
        }

        document.getElementById('time-container').onclick = () => { showRemaining = !showRemaining; updateTime(); };

        document.getElementById('playlist-container').onclick = () => {
            if(playlist.length === 0) return;
            const container = document.getElementById('playlist-items');
            container.innerHTML = '';
            playlist.forEach((f, i) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${i === currentIndex ? 'active' : ''}`;
                item.textContent = `${formatNum(i+1)}. ${f.name.replace(/\.[^/.]+$/, "")}`;
                item.onclick = () => { playTrack(i); document.getElementById('playlist-overlay').style.display = 'none'; };
                container.appendChild(item);
            });
            document.getElementById('playlist-overlay').style.display = 'flex';
        };

        trackTitle.onclick = () => {
            if(currentCover) {
                document.getElementById('album-cover').src = currentCover;
                document.getElementById('artwork-overlay').style.display = 'flex';
            }
        };

        function playTrack(index) {
            if (!isOn || index < 0 || index >= playlist.length) return;
            currentIndex = index;
            audio.src = URL.createObjectURL(playlist[currentIndex]);
            audio.play().then(() => updateDisplay());
        }

        document.getElementById('eject-btn').onclick = () => { if(isOn) drawerArea.classList.toggle('open'); if(drawerArea.classList.contains('open')) setTimeout(() => fileInput.click(), 600); };
        fileInput.onchange = (e) => { if (e.target.files.length > 0) { playlist = Array.from(e.target.files); drawerArea.classList.remove('open'); playTrack(0); } };
        playBtn.onclick = () => { if (isOn && playlist.length > 0) { if (audio.paused) audio.play(); else audio.pause(); updateDisplay(); } };
        document.getElementById('next-btn').onclick = () => { if (isOn && currentIndex < playlist.length - 1) playTrack(currentIndex + 1); };
        document.getElementById('prev-btn').onclick = () => { if (isOn && currentIndex > 0) playTrack(currentIndex - 1); };
        
        function updateTime() {
            if (!audio.duration) return;
            document.getElementById('time-display').textContent = showRemaining ? "-" + formatTime(audio.duration - audio.currentTime) : formatTime(audio.currentTime);
            document.getElementById('time-label').textContent = showRemaining ? "REMAIN" : "TIME";
        }

        audio.addEventListener('timeupdate', updateTime);
        audio.addEventListener('ended', () => { if (currentIndex < playlist.length - 1) playTrack(currentIndex + 1); });
        document.getElementById('close-playlist').onclick = () => document.getElementById('playlist-overlay').style.display = 'none';
        document.getElementById('close-artwork').onclick = () => document.getElementById('artwork-overlay').style.display = 'none';

        document.getElementById('power-toggle').onclick = () => {
            isOn = !isOn;
            document.getElementById('power-led').classList.toggle('off');
            if (!isOn) { audio.pause(); lcdLogo.style.display = 'block'; infoBlock.style.display = 'none'; document.getElementById('time-container').style.opacity = "0"; document.getElementById('playlist-container').style.opacity = "0"; }
            else if(playlist.length > 0) { updateDisplay(); }
        };
    </script>
</body>
</html>

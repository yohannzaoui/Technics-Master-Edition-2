<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technics 778CDT - Grand Master Skeleton Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300..800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --chassis-gradient: linear-gradient(to bottom, #2c2e31 0%, #242629 50%, #1c1e21 100%);
            --lcd-bg: #000000;
            --gold: #d4af37;
            --pure-white: #ffffff;
            --backlight: rgba(255, 255, 255, 0.7); 
            --vu-off: #0a0a0a;
            --font-modern: 'Funnel Sans', sans-serif;
        }

        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: white; overflow: hidden; }

        .hi-fi-container {
            background: var(--chassis-gradient); width: 1500px; height: 720px; padding: 30px 90px; 
            border-radius: 4px; position: relative; border-bottom: 15px solid #111;
            display: flex; flex-direction: column; box-sizing: border-box;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 40px 100px rgba(0,0,0,1), 0 -50px 200px var(--backlight);
        }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); }
        .modal-content { background: #111; border: 1px solid #333; border-radius: 4px; position: relative; width: 600px; z-index: 1001; }
        .modal-close { position: absolute; top: -50px; right: 0; color: #555; font-size: 40px; cursor: pointer; }
        #playlist-items { max-height: 500px; overflow-y: auto; }
        .playlist-item { padding: 15px 25px; border-bottom: 1px solid #222; cursor: pointer; font-size: 13px; font-family: var(--font-modern); text-transform: uppercase; color: #888; }
        .playlist-item:hover { background: #1a1a1a; color: var(--gold); }
        .playlist-item.active { color: var(--pure-white); font-weight: bold; background: #080808; }

        .drawer-wrapper { height: 130px; display: grid; grid-template-columns: 180px 1fr 180px; gap: 40px; align-items: center; margin-bottom: 15px; }
        .power-btn-container { display: flex; justify-content: center; align-items: center; }
        .power-btn { background: linear-gradient(145deg, #3a3c3f, #1a1c1e); border: 1px solid #000; color: #777; height: 45px; width: 82px; cursor: pointer; border-radius: 2px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .power-btn.btn-active { color: var(--pure-white); }

        .drawer-slot-area { width: 100%; height: 85px; background-color: #000; border: 2px solid #111; border-radius: 2px; position: relative; overflow: hidden; }
        .disc-drawer-front { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--chassis-gradient); transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); display: flex; justify-content: center; align-items: center; z-index: 5; }
        .drawer-slot-area.open .disc-drawer-front { transform: translateY(100%); }
        .mash-logo-drawer { height: 35px; width: auto; opacity: 0.85; filter: brightness(1.2); }

        .interface-grid { display: grid; grid-template-columns: 180px 1fr 180px; gap: 40px; align-items: center; flex-grow: 1; }
        .controls-column { display: flex; flex-direction: column; gap: 30px; }
        .btn-square { background: linear-gradient(145deg, #3a3c3f, #1a1c1e); border: 1px solid #000; color: #777; height: 45px; cursor: pointer; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 1.1em; transition: 0.2s; -webkit-user-select: none; user-select: none; }
        
        .btn-active, .btn-square:active { color: var(--pure-white) !important; }

        @keyframes pulse-white-static { 0%, 100% { color: #777; } 50% { color: #fff; } }
        .paused-blink { animation: pulse-white-static 1.5s infinite ease-in-out; }

        .lcd-screen { background: var(--lcd-bg); border: 1px solid #222; border-radius: 4px; height: 280px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; width: 100%; box-sizing: border-box; overflow: hidden; }
        .status-container { position: absolute; top: 30px; opacity: 0; transition: 0.5s; cursor: pointer; z-index: 20; }
        .lcd-label { display: block; font-size: 10px; color: #444; letter-spacing: 2px; font-weight: 900; margin-bottom: 4px; pointer-events: none; }
        .lcd-value { font-size: 20px; color: var(--gold); font-family: 'Courier New'; font-weight: bold; pointer-events: none; }
        .brand-logo { height: 45px; width: auto; filter: grayscale(1) brightness(1.2); opacity: 0.85; }
        
        #volume-display-lcd, #vu-display-lcd { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); font-size: 14px; color: var(--gold); font-weight: 900; letter-spacing: 1px; display: none; z-index: 26; white-space: nowrap; }
        
        .lcd-alerts { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 20px; z-index: 25; }
        #mute-status-lcd { font-size: 12px; color: #ff0000; font-weight: 900; letter-spacing: 2px; display: none; text-shadow: 0 0 8px rgba(255,0,0,0.6); }

        #random-status-lcd { font-size: 10px; color: var(--pure-white); letter-spacing: 2px; font-weight: 900; display: none; margin-top: 4px; }

        .vu-meter-area { position: absolute; bottom: 0; left: 0; width: 100%; display: none; flex-direction: column; gap: 4px; padding-bottom: 12px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
        .vu-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 0 20px; box-sizing: border-box; }
        .vu-label { font-family: var(--font-modern); font-weight: 700; font-size: 12px; color: #bbb; width: 15px; text-align: center; }
        .vu-segments { display: flex; gap: 2px; flex-grow: 1; height: 8px; }
        .segment { flex-grow: 1; background: var(--vu-off); border-radius: 1px; }
        .segment.active-white { background: #fff; }
        .segment.active-red { background: #ff0000; }

        #file-format-badge { font-size: 10px; border: 1px solid #fff; padding: 1px 4px; margin-left: 10px; border-radius: 2px; vertical-align: middle; color: #fff; font-weight: 800; }

        .logo-slot-container { width: 100%; height: 140px; border: 3px solid #000; border-radius: 4px; position: relative; overflow: hidden; background-color: #030303; margin-top: 20px; box-sizing: border-box; }
        .sub-controls-inner { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; gap: 15px; padding: 0 15px; box-sizing: border-box; opacity: 0.7; flex-wrap: wrap; align-content: center; }
        .mini-btn { background: #1a1a1a; border: 1px solid #333; color: #888; padding: 10px 14px; font-size: 11px; font-weight: 800; cursor: pointer; border-radius: 3px; min-width: 85px; text-align: center; text-transform: uppercase; -webkit-user-select: none; user-select: none; transition: 0.2s; }
        
        .mini-btn:active, .btn-mini-active { color: var(--pure-white) !important; border-color: #555 !important; }
        
        .divider { width: 1px; height: 40px; background: #333; }
        .sliding-badge-plate { width: 100%; height: 100%; background: linear-gradient(135deg, rgba(45, 48, 52, 0.6) 0%, rgba(10, 11, 13, 0.85) 100%); backdrop-filter: blur(6px); display: flex; justify-content: space-between; align-items: center; padding: 0 100px; box-sizing: border-box; position: absolute; top: 0; left: 0; z-index: 10; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: inset 1px 1px 0 rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.05); }
        .logo-slot-container.open .sliding-badge-plate { transform: translateY(100%); }
    </style>
</head>
<body>

    <div class="hi-fi-container">
        <div class="drawer-wrapper">
            <div class="power-btn-container">
                <button class="power-btn btn-active" id="power-toggle"><i class="fa-solid fa-power-off"></i></button>
            </div>
            <div class="drawer-slot-area" id="drawer-area"><div class="disc-drawer-front"><img src="img/mash_logo_t.png" alt="MASH" class="mash-logo-drawer"></div></div>
            <div></div>
        </div>

        <div class="interface-grid">
            <div class="controls-column">
                <button class="btn-square" id="eject-btn" style="width:100%"><i class="fa-solid fa-eject"></i></button>
                <div style="display:flex; gap:15px;"><button class="btn-square" id="menu-btn" style="width:50%"><i class="fa-solid fa-bars"></i></button><button class="btn-square" style="width:50%"><i class="fa-solid fa-layer-group"></i></button></div>
            </div>

            <div class="lcd-screen" id="main-lcd">
                <div class="status-container" id="time-container" style="left:40px; text-align:left;"><span class="lcd-label">TIME</span><span class="lcd-value" id="time-display">00:00</span></div>
                
                <div class="lcd-alerts">
                    <div id="mute-status-lcd">MUTE</div>
                </div>

                <div id="volume-display-lcd">VOL 5%</div>
                <div id="vu-display-lcd">VU SENS 0.60</div>

                <div class="status-container" id="playlist-container" style="right:40px; text-align:right;">
                    <span class="lcd-label">TRACK</span>
                    <span class="lcd-value" id="playlist-status">00/00</span>
                    <div id="random-status-lcd">RANDOM</div>
                </div>

                <img src="img/Technics-Logo-org.png" alt="Technics" class="brand-logo" id="lcd-logo">

                <div id="track-info-block" style="display: none; flex-direction: column; align-items: center; gap: 8px; width:95%; z-index: 30;">
                    <div style="display: flex; align-items: center; justify-content: center; width: 100%;">
                        <div id="track-title" style="font-size:24px; color:white; cursor:pointer; text-align:center; font-family: var(--font-modern); font-weight: 600; letter-spacing: 0px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%;"></div>
                        <span id="file-format-badge" style="display:none;"></span>
                    </div>
                    <div id="track-meta" style="font-size:12px; color:rgba(255,255,255,0.5); text-transform:uppercase; font-family: var(--font-modern); font-weight: 400; letter-spacing: 2px;"></div>
                </div>

                <div class="vu-meter-area" id="vu-area">
                    <div class="vu-row"><span class="vu-label">L</span><div class="vu-segments" id="vu-left"></div></div>
                    <div class="vu-row"><span class="vu-label">R</span><div class="vu-segments" id="vu-right"></div></div>
                </div>
            </div>

            <div class="controls-column">
                <button class="btn-square" id="play-btn" style="width:100%"><i class="fa-solid fa-play"></i>&nbsp;<i class="fa-solid fa-pause"></i></button>
                <div style="display:flex; gap:15px;"><button class="btn-square" id="prev-btn" style="width:50%"><i class="fa-solid fa-backward-step"></i></button><button class="btn-square" id="next-btn" style="width:50%"><i class="fa-solid fa-forward-step"></i></button></div>
            </div>
        </div>

        <div style="height: 100px;"></div>

        <div class="logo-slot-container" id="logo-slot">
            <div class="sub-controls-inner">
                <button class="mini-btn" id="vol-dec">VOL -</button><button class="mini-btn" id="vol-inc">VOL +</button><button class="mini-btn" id="mute-btn">MUTE</button>
                <div class="divider"></div>
                <button class="mini-btn">BASS -</button><button class="mini-btn">BASS +</button>
                <div class="divider"></div>
                <button class="mini-btn">TREB -</button><button class="mini-btn">TREB +</button>
                <div class="divider"></div>
                <button class="mini-btn" id="vu-dec">VU -</button>
                <button class="mini-btn btn-mini-active" id="vu-mode-btn">VU MODE</button>
                <button class="mini-btn" id="vu-inc">VU +</button>
                <div class="divider"></div>
                <button class="mini-btn">REPEAT</button><button class="mini-btn" id="random-btn">RANDOM</button>
            </div>
            <div class="sliding-badge-plate">
                <img src="img/Technics-Logo-org.png" alt="Technics" height="26">
                <img src="img/HR_logo.png" alt="High-Res" height="50">
            </div>
        </div>

        <div class="overlay" id="artwork-overlay"><div class="modal-content" style="text-align:center; background:none; border:none;"><span class="modal-close" id="close-artwork">&times;</span><img id="album-cover" src="" style="width:450px; height:450px; object-fit:cover; border:1px solid #333;"></div></div>
        <div class="overlay" id="playlist-overlay"><div class="modal-content"><div style="padding:20px; border-bottom:1px solid #222; display:flex; justify-content:space-between; align-items:center;"><h3 style="margin:0; font-size:13px; color:var(--pure-white); font-family: var(--font-modern); font-weight: 600; letter-spacing:2px;">PLAYLIST</h3><span id="close-playlist" style="color:#555; cursor:pointer; font-size:28px;">&times;</span></div><div id="playlist-items"></div></div></div>
        
        <input type="file" id="file-input" multiple style="display:none" accept=".mp3,.flac,.wav,.m4a">
    </div>

    <script>
        const jsmediatags = window.jsmediatags;
        const audio = new Audio();
        audio.volume = 0.05; 
        
        let playlist = []; let currentIndex = 0; let showRemaining = false; let currentCover = "";
        const numSegments = 60;
        let vuSensitivity = 0.6;
        let vuVisible = true;
        let isRandom = false;
        let volTimer, vuTimer, volRepeatInterval, vuRepeatInterval;

        let scanInterval, holdTimer, isScanning = false;
        let audioCtx, source, analyserL, analyserR, splitter, isAudioInit = false;

        function initAudio() {
            if (isAudioInit) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            source = audioCtx.createMediaElementSource(audio);
            splitter = audioCtx.createChannelSplitter(2);
            analyserL = audioCtx.createAnalyser(); 
            analyserR = audioCtx.createAnalyser();
            analyserL.fftSize = 256; analyserR.fftSize = 256;
            source.connect(splitter); splitter.connect(analyserL, 0); splitter.connect(analyserR, 1);
            source.connect(audioCtx.destination); isAudioInit = true;
        }

        const vuLeft = document.getElementById('vu-left');
        const vuRight = document.getElementById('vu-right');
        function createSegments(container) { for (let i = 0; i < numSegments; i++) { const seg = document.createElement('div'); seg.className = 'segment'; container.appendChild(seg); } }
        createSegments(vuLeft); createSegments(vuRight);

        function drawVU() {
            requestAnimationFrame(drawVU);
            if (!isAudioInit || audio.paused || !vuVisible || audio.muted) { 
                document.querySelectorAll('.segment').forEach(s => s.className = 'segment'); 
                return; 
            }
            const dataL = new Uint8Array(analyserL.frequencyBinCount); const dataR = new Uint8Array(analyserR.frequencyBinCount);
            analyserL.getByteFrequencyData(dataL); analyserR.getByteFrequencyData(dataR);
            const getLevel = (data) => { let sum = 0; for(let i=0; i<data.length; i++) sum += data[i]; return sum / data.length; };
            const updateBar = (container, avg) => {
                const level = Math.min(numSegments, Math.floor((avg / 100) * numSegments * vuSensitivity));
                const segments = container.children;
                for (let i = 0; i < numSegments; i++) {
                    segments[i].className = 'segment';
                    if (i < level) {
                        if (i > numSegments - 10) segments[i].classList.add('active-red');
                        else segments[i].classList.add('active-white');
                    }
                }
            };
            updateBar(vuLeft, getLevel(dataL)); updateBar(vuRight, getLevel(dataR));
        }
        drawVU();

        function showVolLCD() {
            if (document.getElementById('lcd-logo').style.display !== 'none' || audio.muted) return;
            const display = document.getElementById('volume-display-lcd');
            display.textContent = `VOL ${Math.round(audio.volume * 100)}%`;
            display.style.display = 'block';
            document.getElementById('vu-display-lcd').style.display = 'none';
            clearTimeout(volTimer);
            volTimer = setTimeout(() => { display.style.display = 'none'; }, 1000);
        }

        function showVuLCD() {
            if (document.getElementById('lcd-logo').style.display !== 'none' || audio.muted) return;
            const display = document.getElementById('vu-display-lcd');
            display.textContent = `VU SENS ${vuSensitivity.toFixed(2)}`;
            display.style.display = 'block';
            document.getElementById('volume-display-lcd').style.display = 'none';
            clearTimeout(vuTimer);
            vuTimer = setTimeout(() => { display.style.display = 'none'; }, 1000);
        }

        function changeVolume(delta) {
            audio.muted = false;
            audio.volume = Math.max(0, Math.min(1.0, audio.volume + delta));
            updateMuteDisplay();
            showVolLCD();
        }

        function setupVolButton(id, delta) {
            const btn = document.getElementById(id);
            const startRepeat = () => {
                changeVolume(delta);
                volRepeatInterval = setInterval(() => changeVolume(delta), 50);
            };
            const stopRepeat = () => { clearInterval(volRepeatInterval); };
            btn.onmousedown = (e) => { if(e.button === 0) startRepeat(); };
            btn.onmouseup = stopRepeat;
            btn.onmouseleave = stopRepeat;
            btn.ontouchstart = (e) => { e.preventDefault(); startRepeat(); };
            btn.ontouchend = stopRepeat;
            btn.onmouseenter = showVolLCD;
        }

        setupVolButton('vol-inc', 0.01);
        setupVolButton('vol-dec', -0.01);

        function changeVUSensitivity(delta) {
            if(audio.muted) return;
            vuSensitivity = Math.max(0.2, Math.min(3.0, vuSensitivity + delta));
            showVuLCD();
        }

        function setupVUButton(id, delta) {
            const btn = document.getElementById(id);
            const startRepeat = () => {
                changeVUSensitivity(delta);
                vuRepeatInterval = setInterval(() => changeVUSensitivity(delta), 50);
            };
            const stopRepeat = () => { clearInterval(vuRepeatInterval); };
            btn.onmousedown = (e) => { if(e.button === 0) startRepeat(); };
            btn.onmouseup = stopRepeat;
            btn.onmouseleave = stopRepeat;
            btn.ontouchstart = (e) => { e.preventDefault(); startRepeat(); };
            btn.ontouchend = stopRepeat;
            btn.onmouseenter = showVuLCD;
        }

        setupVUButton('vu-inc', 0.05);
        setupVUButton('vu-dec', -0.05);

        document.getElementById('mute-btn').onclick = () => {
            audio.muted = !audio.muted;
            updateMuteDisplay();
        };

        function updateMuteDisplay() {
            const isMuted = audio.muted;
            document.getElementById('mute-btn').classList.toggle('btn-mini-active', isMuted);
            document.getElementById('mute-status-lcd').style.display = isMuted ? 'block' : 'none';
            if(isMuted) {
                document.getElementById('volume-display-lcd').style.display = 'none';
                document.getElementById('vu-display-lcd').style.display = 'none';
            }
        }

        document.getElementById('random-btn').onclick = () => {
            isRandom = !isRandom;
            document.getElementById('random-btn').classList.toggle('btn-mini-active', isRandom);
            document.getElementById('random-status-lcd').style.display = isRandom ? 'block' : 'none';
        };

        document.getElementById('vu-mode-btn').onclick = () => {
            vuVisible = !vuVisible;
            document.getElementById('vu-area').style.display = (vuVisible && playlist.length > 0) ? 'flex' : 'none';
            document.getElementById('vu-mode-btn').classList.toggle('btn-mini-active', vuVisible);
        };

        function updateDisplay() {
            if (playlist.length > 0) {
                document.getElementById('lcd-logo').style.display = 'none'; 
                document.getElementById('track-info-block').style.display = 'flex'; 
                
                // Gestion de l'affichage du VU et de l'état du bouton
                if(vuVisible) {
                    document.getElementById('vu-area').style.display = 'flex';
                    document.getElementById('vu-mode-btn').classList.add('btn-mini-active');
                }
                
                document.getElementById('time-container').style.opacity = "1"; 
                document.getElementById('playlist-container').style.opacity = "1";
                document.getElementById('playlist-status').textContent = `${(currentIndex + 1).toString().padStart(2,'0')}/${playlist.length.toString().padStart(2,'0')}`;
                
                const file = playlist[currentIndex];
                const fileName = file.name;
                const extension = fileName.split('.').pop().toUpperCase();
                
                document.getElementById('track-title').textContent = fileName.replace(/\.[^/.]+$/, "");
                const formatBadge = document.getElementById('file-format-badge');
                formatBadge.textContent = extension;
                formatBadge.style.display = 'inline-block';

                jsmediatags.read(file, {
                    onSuccess: (tag) => {
                        const t = tag.tags; document.getElementById('track-meta').textContent = `${t.artist || "UNKNOWN"} - ${t.album || "UNKNOWN"}`;
                        if (t.picture) {
                            const { data, format } = t.picture; let base = "";
                            for (let i = 0; i < data.length; i++) base += String.fromCharCode(data[i]);
                            currentCover = `data:${format};base64,${window.btoa(base)}`;
                        } else { currentCover = ""; }
                    }
                });
                const playBtn = document.getElementById('play-btn');
                if (audio.paused) playBtn.classList.add('paused-blink'); else playBtn.classList.remove('paused-blink');
                
                playBtn.style.color = audio.paused ? "#777" : "var(--pure-white)";
            }
        }

        document.getElementById('time-container').onclick = () => { showRemaining = !showRemaining; updateTime(); };
        document.getElementById('track-title').onclick = () => { if(currentCover) { document.getElementById('album-cover').src = currentCover; document.getElementById('artwork-overlay').style.display = 'flex'; } };
        document.getElementById('playlist-container').onclick = () => {
            const container = document.getElementById('playlist-items'); container.innerHTML = '';
            playlist.forEach((f, i) => {
                const item = document.createElement('div'); item.className = `playlist-item ${i === currentIndex ? 'active' : ''}`;
                item.textContent = `${(i+1).toString().padStart(2,'0')}. ${f.name.replace(/\.[^/.]+$/, "")}`;
                item.onclick = () => { playTrack(i); document.getElementById('playlist-overlay').style.display = 'none'; };
                container.appendChild(item);
            });
            document.getElementById('playlist-overlay').style.display = 'flex';
        };

        document.getElementById('play-btn').onclick = () => { if (playlist.length > 0) { initAudio(); if (audio.paused) audio.play(); else audio.pause(); updateDisplay(); } };
        document.getElementById('eject-btn').onclick = () => { document.getElementById('drawer-area').classList.toggle('open'); if(document.getElementById('drawer-area').classList.contains('open')) setTimeout(() => document.getElementById('file-input').click(), 600); };
        document.getElementById('file-input').onchange = (e) => { if (e.target.files.length > 0) { playlist = Array.from(e.target.files); document.getElementById('drawer-area').classList.remove('open'); playTrack(0); } };
        
        function playTrack(index) { initAudio(); currentIndex = index; audio.src = URL.createObjectURL(playlist[currentIndex]); audio.play().then(() => updateDisplay()); }

        function nextTrack() {
            if (isRandom && playlist.length > 1) {
                let nextIdx;
                do { nextIdx = Math.floor(Math.random() * playlist.length); } while (nextIdx === currentIndex);
                playTrack(nextIdx);
            } else if (currentIndex < playlist.length - 1) {
                playTrack(currentIndex + 1);
            } else {
                updateDisplay();
            }
        }

        audio.onended = nextTrack;

        function startScan(direction) { isScanning = true; scanInterval = setInterval(() => { audio.currentTime += (direction * 2); }, 100); }
        function stopScan() { clearInterval(scanInterval); isScanning = false; }

        function setupScanButton(id, direction, action) {
            const btn = document.getElementById(id);
            btn.onmousedown = () => { if (playlist.length === 0) return; holdTimer = setTimeout(() => startScan(direction), 500); };
            btn.onmouseup = () => { clearTimeout(holdTimer); if (isScanning) stopScan(); else action(); };
            btn.onmouseleave = () => { clearTimeout(holdTimer); if (isScanning) stopScan(); };
            btn.ontouchstart = (e) => { e.preventDefault(); if (playlist.length === 0) return; holdTimer = setTimeout(() => startScan(direction), 500); };
            btn.ontouchend = () => { clearTimeout(holdTimer); if (isScanning) stopScan(); else action(); };
        }

        setupScanButton('next-btn', 1, nextTrack);
        setupScanButton('prev-btn', -1, () => { if (currentIndex > 0) playTrack(currentIndex - 1); });

        document.getElementById('power-toggle').onclick = () => location.reload();

        function updateTime() {
            const time = showRemaining ? (audio.duration - audio.currentTime) : audio.currentTime;
            if (isNaN(time)) return;
            const sign = (showRemaining && time > 0) ? "-" : "";
            document.getElementById('time-display').textContent = sign + new Date(time * 1000).toISOString().substr(14, 5);
        }

        audio.addEventListener('timeupdate', updateTime);
        document.getElementById('close-artwork').onclick = () => document.getElementById('artwork-overlay').style.display = 'none';
        document.getElementById('close-playlist').onclick = () => document.getElementById('playlist-overlay').style.display = 'none';
        document.getElementById('menu-btn').onclick = () => { document.getElementById('logo-slot').classList.toggle('open'); document.getElementById('menu-btn').classList.toggle('btn-active'); };
    </script>
</body>
</html>
